name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        # agents/ is excluded: it's dead code not imported by the running app
        # (see agents/executor_agent.py, agents/validator_agent.py - pre-existing,
        # unrelated syntax errors) and is tracked separately.
        run: python -m compileall -q api_v1 configs core services tools utils main.py

      - name: Import smoke test
        env:
          OLLAMA_MASTER_URL: http://localhost:11434
          OLLAMA_WORKER_URL: http://localhost:11435
          OLLAMA_CPU_NODES: ""
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          QDRANT_HOST: http://localhost:6333
        run: python -c "import api_v1.main"

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
