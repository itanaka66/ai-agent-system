server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes (e.g. /workflows/some-name) must fall
    # back to index.html instead of a plain 404 on refresh/direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the orchestrator container (Docker's embedded DNS
    # resolves the "orchestrator" service name within the compose network).
    location /api/ {
        proxy_pass http://orchestrator:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
        proxy_pass http://orchestrator:8000/metrics;
    }
}
